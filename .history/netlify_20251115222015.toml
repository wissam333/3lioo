[build]
  command = "npm run build"
  publish = ".output/public"

[functions]
  directory = ".netlify/functions"

# 1. Redirect API → server functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# 2. SPA fallback for Nuxt pages
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
