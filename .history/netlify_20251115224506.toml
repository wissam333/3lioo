[build]
  command = "npm run build"
  publish = ".output/public"

[functions]
  directory = ".netlify/functions"

# API requests → server functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# All SPA pages fallback → index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true
