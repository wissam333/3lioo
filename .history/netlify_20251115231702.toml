[build]
  command = "npm run build"
  publish = ".output/public"

[functions]
  directory = ".netlify/functions"

# 1. API routes → Nitro serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server/:splat"
  status = 200
  force = true

# 2. All other routes → Nitro serverless function (SSR)
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
  force = true
