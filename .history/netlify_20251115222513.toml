[build]
  command = "npm run build"
  publish = ".output/public"

[functions]
  directory = ".netlify/functions"

# 1. Nuxt server middleware (API + SSR)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server"
  status = 200

# 2. SPA fallback (fix page reload 404)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
