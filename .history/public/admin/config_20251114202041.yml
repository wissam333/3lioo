backend:
  name: git-gateway
  branch: master
  site_id: 3lioo.netlify.app

# Media settings
media_folder: "public/images/uploads"
public_folder: "/images/uploads"

# Editorial workflow
publish_mode: editorial_workflow

# Global settings
site_url: "https://3lioo.netlify.app"
display_url: "https://3lioo.netlify.app"
logo_url: "/logo/logo.png"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "blog/{{slug}}"
    preview_path_date_field: "date"
    sortable_fields: ["date", "title"]
    view_filters:
      - label: "Draft Posts"
        field: "published"
        pattern: false
      - label: "High Threat Level"
        field: "threatLevel"
        pattern: "high"
    view_groups:
      - label: "Year"
        field: "date"
        pattern: "\\d{4}"
      - label: "Category"
        field: "category"
      - label: "Threat Level"
        field: "threatLevel"
    fields:
      - {
          label: "Title",
          name: "title",
          widget: "string",
          pattern: [".{10,}", "Must have at least 10 characters"],
        }
      - {
          label: "Publish Date",
          name: "date",
          widget: "datetime",
          date_format: "YYYY-MM-DD",
          time_format: "HH:mm",
          format: "YYYY-MM-DD HH:mm",
        }
      - {
          label: "Update Date",
          name: "updated",
          widget: "datetime",
          required: false,
          date_format: "YYYY-MM-DD",
          time_format: "HH:mm",
          format: "YYYY-MM-DD HH:mm",
        }
      - {
          label: "Author",
          name: "author",
          widget: "string",
          default: "Security Team",
        }
      - {
          label: "Excerpt",
          name: "excerpt",
          widget: "text",
          pattern: [".{50,150}", "Must be between 50 and 150 characters"],
        }
      - {
          label: "Featured",
          name: "featured",
          widget: "boolean",
          default: false,
        }
      - {
          label: "Published",
          name: "published",
          widget: "boolean",
          default: true,
        }
      - {
          label: "Body",
          name: "body",
          widget: "markdown",
          buttons:
            [
              "bold",
              "italic",
              "code",
              "link",
              "heading-one",
              "heading-two",
              "heading-three",
              "quote",
              "bulleted-list",
              "numbered-list",
              "image",
            ],
          editor_components: ["image", "code-block"],
        }
      - label: "SEO Settings"
        name: "seo"
        widget: "object"
        collapsed: true
        fields:
          - {
              label: "Meta Title",
              name: "metaTitle",
              widget: "string",
              required: false,
              hint: "If empty, post title will be used",
            }
          - {
              label: "Meta Description",
              name: "metaDescription",
              widget: "text",
              required: false,
              hint: "If empty, excerpt will be used",
            }
          - {
              label: "Canonical URL",
              name: "canonicalUrl",
              widget: "string",
              required: false,
            }
          - {
              label: "No Index",
              name: "noIndex",
              widget: "boolean",
              default: false,
            }
      - label: "Featured Image"
        name: "featuredImage"
        widget: "object"
        fields:
          - { label: "Image", name: "url", widget: "image", required: false }
          - {
              label: "Alt Text",
              name: "alt",
              widget: "string",
              required: false,
            }
          - {
              label: "Caption",
              name: "caption",
              widget: "string",
              required: false,
            }
      - label: "Gallery Images"
        name: "gallery"
        widget: "list"
        required: false
        fields:
          - { label: "Image", name: "image", widget: "image" }
          - { label: "Alt Text", name: "alt", widget: "string" }
          - {
              label: "Caption",
              name: "caption",
              widget: "string",
              required: false,
            }
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - { label: "Security", value: "security" }
          - { label: "Threat Intelligence", value: "threat-intel" }
          - { label: "Vulnerability Analysis", value: "vulnerability" }
          - { label: "Incident Response", value: "incident-response" }
          - { label: "Compliance", value: "compliance" }
          - { label: "Tools & Techniques", value: "tools" }
        default: "security"
      - label: "Threat Level"
        name: "threatLevel"
        widget: "select"
        options:
          - { label: "ℹ️ Info", value: "info" }
          - { label: "🟢 Low", value: "low" }
          - { label: "🟡 Medium", value: "medium" }
          - { label: "🟠 High", value: "high" }
          - { label: "🔴 Critical", value: "critical" }
        default: "info"
      - {
          label: "Read Time",
          name: "readTime",
          widget: "string",
          default: "5 min read",
          pattern: ["\\d+\\s*min.*", "Should be in format like '5 min read'"],
        }
      - label: "Tags"
        name: "tags"
        widget: "list"
        allow_add: true
        default: ["security"]
      - label: "Attachments"
        name: "attachments"
        widget: "list"
        required: false
        fields:
          - { label: "File Name", name: "name", widget: "string" }
          - { label: "File", name: "file", widget: "file" }
          - {
              label: "Description",
              name: "description",
              widget: "string",
              required: false,
            }
      - label: "Related Posts"
        name: "relatedPosts"
        widget: "relation"
        collection: "blog"
        search_fields: ["title"]
        value_field: "slug"
        display_fields: ["title"]
        multiple: true
        required: false
        hint: "Select posts that are related to this content"

  - name: "authors"
    label: "Authors"
    folder: "content/authors"
    create: true
    slug: "{{slug}}"
    identifier_field: "name"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Role", name: "role", widget: "string" }
      - { label: "Bio", name: "bio", widget: "text" }
      - { label: "Avatar", name: "avatar", widget: "image", required: false }
      - label: "Social Links"
        name: "social"
        widget: "object"
        required: false
        fields:
          - {
              label: "Twitter",
              name: "twitter",
              widget: "string",
              required: false,
            }
          - {
              label: "LinkedIn",
              name: "linkedin",
              widget: "string",
              required: false,
            }
          - {
              label: "GitHub",
              name: "github",
              widget: "string",
              required: false,
            }
          - {
              label: "Website",
              name: "website",
              widget: "string",
              required: false,
            }

  - name: "pages"
    label: "Pages"
    folder: "content/pages"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Body", name: "body", widget: "markdown" }
